[project]
name = "outlook-draft-cli"
version = "0.1.0"
description = "CLI to create and manage Outlook email drafts via Outlook REST API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "python-dateutil>=2.9.0",
    "playwright>=1.40",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["outlook_draft*"]
exclude = ["session_state*", "tests*"]

[tool.pytest.ini_options]
markers = [
    "live: tests that mutate live Outlook data and require OUTLOOK_CLI_LIVE=1",
]

[project.scripts]
outlook-cli = "outlook_draft.cli:main"
